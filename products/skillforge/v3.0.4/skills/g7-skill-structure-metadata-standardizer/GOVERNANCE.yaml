critical_control_assurance:
  contract_ref: INC_CRITICAL_CONTROL_ASSURANCE_V1
  build_time_gate: CRITICAL_CONTROLS_COMPILED
  runtime_exit_gate: CRITICAL_CONTROLS_VERIFIED
  controls:
  - id: G7-CC-01
    rule: Stable identity/version/lifecycle/role/complexity/owner metadata is present.
    mandatory: true
    evidence_required: true
  - id: G7-CC-02
    rule: Build-Time/Runtime applicability and resource/dependency refs are explicit.
    mandatory: true
    evidence_required: true
  - id: G7-CC-03
    rule: Runtime/installable package contains only justified files.
    mandatory: true
    evidence_required: true
  - id: G7-CC-04
    rule: Critical-control contract and runtime exit gate are exposed.
    mandatory: true
    evidence_required: true
  - id: G7-CC-05
    rule: Builder provenance and framework membership are independently resolved and
      Registry-backed.
    mandatory: true
    evidence_required: true
  - id: G7-CC-06
    rule: Every Skill built/upgraded by SkillForge has one resolved central-framework
      or standalone backlog reference/owner.
    mandatory: true
    evidence_required: true
  - id: G7-CC-07
    rule: Applicable human-readable table profiles compile first-column NUM# while
      preserving stable IDs.
    mandatory: true
    evidence_required: true
  - id: G7-CC-08
    rule: Artifact-producing Skills compile INC_REMOTE_ARTIFACT_DELIVERY_V2 with G1
      physical routing and verified remote-link completion.
    mandatory: true
    evidence_required: true
  - id: G7-CC-09
    rule: Configurable Skills compile INC_SKILL_SETUP_CONTRACT_V1 with semantic setup
      IDs and no customer-specific physical values in public Core.
    mandatory: true
    evidence_required: true
  - id: G7-CC-10
    rule: Source and materialized package structured metadata pass strict UTF-8/parser
      validation and normalized semantic parity before freeze.
    mandatory: true
    evidence_required: true
global_critical_assurance:
  contract_ref: INC_CRITICAL_CONTROL_ASSURANCE_V2
