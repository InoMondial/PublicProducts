  raw_byte_utf8: required
  formats:
  - YAML
  - JSON
  - TOML
  - FRONTMATTER
  - RELEASE_CONTROL
  prefreeze_parse: required
  post_materialization_parse: required
  normalized_semantic_parity: required
  fail_closed_on_literal_escape_artifact: true
  g12_g13_exact_evidence: required
source_references:
  registry_ref: INC_SOURCE_REFERENCE_REGISTRY
