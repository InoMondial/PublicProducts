schema_version: '1.0'
contract_id: INC_UNIVERSAL_TABLE_REFERENCEABILITY_V1
owner_skill: G7
compiler_owner: G0
status: ACTIVE_CANDIDATE
scope: Human-readable tabular outputs generated by governed Skills/Agents/Work/Codex activities.
rule:
  first_column_label: NUM#
  first_column_required: true
  numbering_start: 1
  independent_table_restart: true
  same_logical_table_across_pages_continue_sequence: true
  num_is_presentation_counter_not_business_id: true
surfaces:
  chat_markdown: REQUIRED
  spreadsheet_excel: REQUIRED
  word_docx: REQUIRED
  pdf: REQUIRED
  slides: REQUIRED
  html_teams_email: REQUIRED
  csv_human_facing: REQUIRED
  other_human_readable_tables: REQUIRED
exceptions:
  machine_schema_fixed_output:
    allowed: true
    condition: The machine/third-party schema cannot legally accept an added presentation field.
    requirement: Any human-facing rendered view derived from the fixed schema must still expose NUM# as first presentation column when feasible.
  raw_protocol_payload:
    allowed: true
    condition: Not a human-readable table and governed by a fixed external protocol/schema.
validation:
  first_column_exact_label: required
  contiguous_sequence: required
  duplicate_or_missing_num: release_finding
  stable_business_id_preservation: required
  explicit_exception_evidence: required
runtime:
  g16_chat_tables: REQUIRED
  child_skills_full_contract_copy: prohibited
  stable_reference_or_compiled_rule: required
