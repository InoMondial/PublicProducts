<!-- G15 Teams report skeleton: populate values, do not expose placeholders -->
<div dir="ltr" style="text-align:left">
  <h2>📊 {{TITLE}}</h2>
  <p><b>Outcome:</b> {{OUTCOME}}</p>
  <h3>Summary</h3>
  <table>
    <thead><tr><th>Item</th><th>Summary</th><th>Impact / Consequence</th><th>Recommended Next Step</th><th>Open</th></tr></thead>

  </table>
  <h3>🔗 Quick Links</h3>
  <ul>{{LINKS}}</ul>
</div>
