  controls:
  - id: G9-CC-01
    rule: Deterministic and metadata checks precede heavier work where sufficient.
    mandatory: true
    evidence_required: false
  - id: G9-CC-02
    rule: Resource Class remains independent from artifact complexity and security.
    mandatory: true
    evidence_required: true
  - id: G9-CC-03
    rule: Required quality security approval release testing and evidence are never
      optimized away.
    mandatory: true
    evidence_required: false
  - id: G9-CC-04
    rule: Unavailable actual resource telemetry is never fabricated or replaced by
      estimates.
    mandatory: true
    evidence_required: true
  - id: G9-CC-05
    rule: Material future resource improvements may emit governed SYSTEM_DISCOVERED
      intake but never self-modify Production or recursively load G0.
    mandatory: true
    evidence_required: true
  - id: G9-CC-06
    rule: Source-specific reserve behavior is not claimed while G9_EXTERNAL_CHANGE_REQUEST
      is blocked.
    mandatory: true
    evidence_required: true
  - id: G9-CC-07
    rule: Material data/query work applies INC_G9_G17_DATA_RESOURCE_OPTIMIZATION_V1
      before token micro-optimization.
    mandatory: true
    evidence_required: true
  - id: G9-CC-08
    rule: Production provider/service resolves a G17-owned resource/capability profile
      and avoids direct consumer binding.
    mandatory: true
    evidence_required: true
  - id: G9-CC-09
    rule: Routine collectors use zero model calls and broad five-minute browser/UI
      polling is prohibited.
    mandatory: true
    evidence_required: true
  - id: G9-CC-10
    rule: Provider resource truth is MEASURED VALIDATED_ESTIMATE or UNKNOWN and quota
      deltas are not fabricated as tokens.
    mandatory: true
    evidence_required: true
  - id: G9-CC-11
    rule: Paid provider changes require owner approval cost-benefit disclosure and
      G16 activation routing.
    mandatory: true
    evidence_required: true
  - id: G9-CC-12
    rule: G11 normalizes G17 persists G15 delivers alerts and no parallel G9 database
      exists.
    mandatory: true
    evidence_required: true
