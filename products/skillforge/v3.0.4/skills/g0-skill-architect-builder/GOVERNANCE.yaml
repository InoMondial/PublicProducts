  runtime_exit_gate: CRITICAL_CONTROLS_VERIFIED
  self_exit_check: REQUIRED_WHEN_RUNTIME_APPLICABLE
  independent_double_check: CONDITIONAL_MATERIAL_RISK
  controls:
  - id: G0-CC-01
    rule: Qualify the artifact and resolve REUSE -> ADAPT -> COMPOSE -> NEW before
      creating a new governed Skill.
    mandatory: true
    runtime_condition: WHEN_RELEVANT_TO_CURRENT_ACTIVITY
    evidence_required: false
  - id: G0-CC-02
    rule: Both Build-Time self-compliance and Runtime governance propagation are complete
      for every applicable capability.
    mandatory: true
    runtime_condition: WHEN_RELEVANT_TO_CURRENT_ACTIVITY
    evidence_required: true
  - id: G0-CC-03
    rule: Owner-authorized release has actual available test evidence and quality
      review on the exact artifact; same executor is allowed; independent certification
      must never be falsely claimed.
    mandatory: true
    runtime_condition: WHEN_RELEVANT_TO_CURRENT_ACTIVITY
    evidence_required: true
  - id: G0-CC-04
    rule: Managed publication is routed through G1 and remote reconciliation is complete
      before terminal success.
    mandatory: true
    runtime_condition: WHEN_RELEVANT_TO_CURRENT_ACTIVITY
    evidence_required: true
  - id: G0-CC-05
    rule: Plugin output requires explicit user opt-in after successful G1 Skill publication/read-back,
      is handed to G17, and public directory submission requires separate explicit
      approval.
    mandatory: true
    runtime_condition: WHEN_PLUGIN_OUTPUT_REQUESTED
    evidence_required: true
  - id: G0-CC-06
    rule: A material future-version change discovered during governed SkillForge Build/Maintenance
      is linked to or captured in INC_SKILLFORGE_UNIFIED_BACKLOG; ordinary runtime
      is not forced to load G0 for backlog handling.
    mandatory: true
    runtime_condition: WHEN_MATERIAL_FUTURE_VERSION_CHANGE_DISCOVERED
    evidence_required: true
  - id: G0-CC-07
    rule: Every Skill built/materially upgraded by SkillForge resolves exactly one
      governed central-framework or standalone backlog topology and owner before release;
      SYSTEM_DISCOVERED learning cannot self-modify Production.
    mandatory: true
    runtime_condition: WHEN_BUILDING_OR_UPGRADING_A_SKILL
    evidence_required: true
  - id: G0-CC-08
    rule: Framework membership is Registry/metadata-backed and builder provenance
      cannot make an external Skill a SkillForge member.
    mandatory: true
    runtime_condition: WHEN_BUILDING_OR_RESOLVING_A_SKILL
    evidence_required: true
  - id: G0-CC-09
    rule: Applicable human-readable tabular output profiles compile first-column NUM#
      referenceability without replacing stable business identifiers.
    mandatory: true
    runtime_condition: WHEN_HUMAN_READABLE_TABLE_OUTPUT_IS_POSSIBLE
    evidence_required: true
  - id: G0-CC-11
    rule: Any prompt/instruction/work-order/Handoff/report/command-file/execution-artifact
      generated for another Chat/Work/Codex/agent surface resolves and applies latest
      G16 before generation, follows PowerShell-first when applicable, and is remotely
      published/read back before only a verified link/stable reference is handed over.
    mandatory: true
    runtime_condition: WHEN_CROSS_SURFACE_GENERATION_OCCURS
    evidence_required: true
