policy_id: G16_SECRET_GUARD_POLICY_V1
status: TEST_CANDIDATE
purpose: Defense-in-depth exclusion of credentials and secrets from persisted Handoff state.
prohibited:
  - passwords
  - access_tokens
  - bearer_tokens
  - api_keys
  - private_keys
  - session_secrets
  - authentication_cookies
  - hidden_chain_of_thought
  - hidden_system_or_developer_instructions
runtime:
  semantic_secret_review: REQUIRED
  deterministic_marker_scan: REQUIRED_DEFENSE_IN_DEPTH
  deterministic_scan_is_complete_proof: false
  safe_redaction_preferred: true
  use_reference_instead_of_raw_secret_when_possible: true
  unresolved_secret: BLOCK_PERSISTENCE
marker_classes:
  - '(?i)password\s*[:=]'
  - '(?i)authorization\s*:\s*bearer'
  - '(?i)bearer\s+[A-Za-z0-9._-]{8,}'
  - '\bsk-[A-Za-z0-9_-]{8,}\b'
  - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
  - '(?i)(api[_ -]?key|access[_ -]?token|client[_ -]?secret)\s*[:=]'
false_positive_handling:
  - do_not_delete_unrelated_material_blindly
  - if_ambiguous_block_and_disclose_persistence_failure
