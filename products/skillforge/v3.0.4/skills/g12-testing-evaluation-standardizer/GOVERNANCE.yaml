schema: INC_GOVERNANCE_SKILL_CANDIDATE_V1
stable_id: O6-SKL-012
visible_id: G12
display_name: G12-Testing & Evaluation Standardizer
version: 3.4.3
lifecycle: production
phase: 6
functional_role: QUALITY
dpga:
  build_time: REQUIRED
  runtime: CONDITIONAL
  hard_gates:
  - DPGA_COMPLETE
  - GOVERNANCE_PROPAGATION_COMPLETE
  - TEST_PROFILE_COMPLETE
  - GLOBAL_CRITICAL_CONTROLS_COMPILED
  - GLOBAL_CRITICAL_CONTROLS_VERIFIED
runtime_condition: material_live_or_risk_based_validation_needed
critical_control_assurance:
  contract_ref: INC_CRITICAL_CONTROL_ASSURANCE_V1
  build_time_gate: CRITICAL_CONTROLS_COMPILED
  runtime_exit_gate: CRITICAL_CONTROLS_VERIFIED
  self_exit_check: REQUIRED_WHEN_RUNTIME_APPLICABLE
  independent_double_check: CONDITIONAL_MATERIAL_RISK
  controls:
  - id: G12-CC-01
    rule: A proportional test profile exists and changed/critical behavior is covered.
    mandatory: true
    runtime_condition: WHEN_RELEVANT_TO_CURRENT_ACTIVITY
    evidence_required: true
  - id: G12-CC-02
    rule: Deterministic/static checks run before heavier live/evaluator tests.
    mandatory: true
    runtime_condition: WHEN_RELEVANT_TO_CURRENT_ACTIVITY
    evidence_required: true
  - id: G12-CC-03
    rule: Runtime/live testing is invoked only when behavior materially depends on
      live state/risk/acceptance.
    mandatory: true
    runtime_condition: WHEN_RELEVANT_TO_CURRENT_ACTIVITY
    evidence_required: false
  - id: G12-CC-04
    rule: Retries are bounded and a second independent evaluator is used only when
      risk/conflict/certification requires it.
    mandatory: true
    runtime_condition: WHEN_RELEVANT_TO_CURRENT_ACTIVITY
    evidence_required: true
global_critical_assurance:
  contract_ref: INC_CRITICAL_CONTROL_ASSURANCE_V2
  assurance_skill_ref: G3
  implicit_inheritance: REQUIRED
  runtime_exit_gate: GLOBAL_CRITICAL_CONTROLS_VERIFIED
  compact_vector:
  - local
  - security
  - optimization
  - logging
  - notification
  - archive
  - terminal
  full_provider_skill_load_default: prohibited
  provider_detail_load: JIT_ON_MATERIAL_BRANCH_FAILURE_OR_EVIDENCE_NEED
public_release_acceptance:
  contract_ref: INC_SKILLFORGE_PUBLIC_RELEASE_ACCEPTANCE_V1
  backlog_refs:
  - SF-G12-003
  - SF-G12-004
  exact_frozen_source_identity: REQUIRED
  deterministic_export_rebuild: REQUIRED
  private_history_or_overlay_leak: HARD_BLOCK
  ownership_or_license_conflict: HARD_BLOCK
  required_notice_or_attribution_missing: HARD_BLOCK
  post_release_assurance_pending_is_pre_release_failure: false
  residual_assurance_disclosure: REQUIRED
  final_independent_g13: REQUIRED
release_acceptance_policy:
  contract_ref: INC_AUTONOMOUS_RELEASE_ACCEPTANCE_V1
  profile: AUTONOMOUS_EVIDENCE_BASED
  precedence: SUPERSEDES_RELEASE_ONLY_EXTERNAL_EXECUTOR_GATES
  available_tests: REQUIRED
  failed_executed_tests: BLOCK_RELEASE
  external_assurance: OPTIONAL_NONBLOCKING
  real_publication_readback: REQUIRED
  runtime_security_authorization: UNCHANGED
publication_privacy_contract: INC_PUBLICIZATION_PRIVACY_GATE_V2
public_release_requires_new_owner_consent: true
