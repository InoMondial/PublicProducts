policy_id: INC_G17_IDENTITY_ACCESS_SECRETS_V1
status: GENERIC_POLICY_EXTERNAL_PROFILE_REQUIRED
scope:
- G17 gateway
- provider adapters
- Hatchable routes/functions
- SharePoint key custody
- connector/OAuth authorization
- backup bridge service identity
- generated Skills using persistence
principles:
- deny_by_default
- least_privilege
- separate_human_service_scheduler_and_end_user_identities
- separate_route_authorization_from_row_scope
- consumer_skills_never_receive_provider_admin_credentials
- secrets_never_enter_chat_handoff_logs_github_or_business_tables
- root_encryption_key_never_stored_in_database_provider
- every_persistent_action_attributable_to_actor_ref
identity_classes:
  OWNER_HUMAN:
    purpose: project ownership, approvals, emergency admin
    current_hatchable_role: owner
  G17_GATEWAY_RUNTIME:
    purpose: provider-neutral governed runtime operations
    rule: call provider only through G17 adapter and authorized connector/runtime
  G17_ADMIN_RUNTIME:
    purpose: migrations, backup, restore, schema/admin operations
    rule: separate elevated path; ordinary Skills cannot invoke directly
  PROVIDER_SCHEDULER:
    purpose: internal scheduled maintenance/backup generation
    hatchable_access: scheduler
  BACKUP_BRIDGE_SERVICE:
    purpose: Power Automate transfer/verification/retention
    status: Stage19 service identity/auth contract required
  APP_END_USER:
    purpose: generated-app user data where applicable
    hatchable_access: user
  PROJECT_COLLABORATOR:
    purpose: project member/operator
    hatchable_access: member_or_admin
authorization:
  hatchable_route_access:
    public:
      allowed_only_for: explicitly_public_non_sensitive_endpoints
      forbidden_for:
      - database_admin
      - backup_download
      - schema
      - restore
      - secrets
      - internal_health_with_sensitive_metadata
    member:
      rule: collaborator_read_or_bounded_workspace_operation_only
    admin:
      rule: owner_or_admin_operator_operations
    scheduler:
      rule: scheduled_internal_job_only_not_externally_reachable
  row_access:
    rule: route_access_is_not_row_authorization
    per_user_tables: use_provider_row_access_when_applicable
    admin_routes: explicit_project_or_user_scope_still_required_when_intent_is_bounded
  project_isolation:
    project_ref_required: true
    cross_project_access_default: DENY
    exception: explicit_governed_cross_project_contract
secret_classes:
  PLATFORM_OAUTH_TOKEN:
    preferred_storage: platform_native_connected_app_or_provider_oauth
    plaintext_model_access: FORBIDDEN
  THIRD_PARTY_API_CREDENTIAL:
    preferred_storage: provider_native_oauth_or_secret_setup_gate
    plaintext_model_access: FORBIDDEN
  G17_ROOT_KEK:
    current_storage: restricted_SharePoint_key_custody
    provider_database_storage: FORBIDDEN
    hatchable_secret_storage: FORBIDDEN_FOR_PROVIDER_BLIND_THREAT_MODEL
    chat_handoff_log_github_storage: FORBIDDEN
  BACKUP_BRIDGE_CREDENTIAL:
    preferred_storage: Power_Automate_connection_or_approved_secret_mechanism
    must_be_separate_from_ROOT_KEK: true
  HATCHABLE_PROJECT_SECRET:
    declaration: hatchable.toml_secret_or_api_block
    value_entry: human_setup_gate_only
    agent_writes_value: FORBIDDEN
secret_handling:
  redact_logs: true
  redact_errors: true
  redact_handoff: true
  redact_notifications: true
  URL_query_secret: FORBIDDEN
  filename_secret: FORBIDDEN
  database_row_plaintext_secret: FORBIDDEN
  spreadsheet_plaintext_secret: FORBIDDEN
  source_code_secret: FORBIDDEN
  clipboard_secret_transfer_by_agent: FORBIDDEN
  rotation_metadata_required: true
  secret_reference_not_value: true
runtime_access:
  ordinary_skill:
    allowed:
    - DB_GET
    - DB_SEARCH
    - DB_CREATE
    - DB_UPDATE
    - governed_DB_DELETE
    - DB_TRANSACTION
    - DB_AGGREGATE
    - DB_HEALTH
    forbidden:
    - raw_provider_admin_tool
    - unrestricted_SQL
    - DB_MIGRATE
    - DB_RESTORE
    - secret_read
  admin_path:
    allowed_only_with:
    - authorized_operator_or_governed_release_workflow
    - G17_policy_gate
    - G11_audit
    - required_owner_gate_for_material_actions
hatchable_specific:
  framework_access_values:
  - public
  - user
  - member
  - admin
  - scheduler
  selected_defaults:
    backup_generation_route: scheduler
    temporary_backup_download_during_PoC: admin
    health_admin_route: admin
    write_admin_route: admin
  secret_declaration_rule: values_are_entered_by_human_setup_gate_not_agent
service_identity_policy:
  no_shared_human_password_for_automation: true
  no_broad_tenant_permission_when_narrow_scope_possible: true
  backup_bridge:
    Stage19_requirement: dedicated_nonpublic_authenticated_transfer_path
    public_download_endpoint: FORBIDDEN
logging:
  actor_ref_required_for_mutations: true
  G11_events_required_for:
  - permission_change
  - auth_failure
  - secret_setup_change_without_value
  - admin_operation
  - high_impact_delete
  - migration
  - backup_restore
  secret_value_in_G11: FORBIDDEN
break_glass:
  enabled: DESIGN_ONLY
  rules:
  - owner_only
  - time_bounded
  - reason_required
  - G11_audit_required
  - revoke_after_use
  - never_bypass_encryption_or_export_root_key_into_provider
release_gates:
- no_public_database_admin_or_backup_endpoint
- no_plaintext_secret_in_scanned_governed_surfaces
- admin_scheduler_member_user_routes_have_negative_access_tests
- generated_Skill_manifest_declares_required_identity_and_authorization_scope
- Stage18_closes_root_key_management
- Stage19_closes_backup_bridge_service_identity
key_custody:
  secret_ref_parameter: ROOT_KEK_SECRET_REF
  physical_path_in_package: FORBIDDEN
  principals_parameter: KEY_CUSTODIANS_REF
