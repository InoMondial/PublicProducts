  four_planes:
    A_skillforge_design_evolution: true
    B_skillforge_builder_runtime: true
    C_generated_skill_design_time: true
    D_generated_skill_runtime: CONDITIONAL_PERSISTENCE_NEED
runtime:
  propagation: MINIMUM_APPLICABLE
  ordinary_operations:
  - DB_GET
  - DB_SEARCH
  - DB_CREATE
  - DB_UPDATE
  - DB_DELETE
  - DB_TRANSACTION
  - DB_AGGREGATE
  - DB_HEALTH
  admin_operations:
  - DB_SCHEMA_STATUS
  - DB_MIGRATE
  - DB_BACKUP
  - DB_RESTORE
  - DB_PROVIDER_STATUS
  - DB_QUOTA_STATUS
  provider_specific_direct_calls_by_consumer: FORBIDDEN
critical_controls:
- id: G17-CC-01
  rule: Storage placement and authority are explicitly qualified before durable persistence
    is introduced or changed.
  mandatory: true
- id: G17-CC-02
  rule: Every durable DB operation resolves project_ref; PRJ_MISC requires workload_ref
    or domain_ref.
  mandatory: true
- id: G17-CC-03
  rule: Provider-neutral gateway contract remains between consumer Skills and provider
    adapters.
  mandatory: true
- id: G17-CC-04
  rule: S3/S4 provider-stored protected fields use approved external-key application
    encryption.
  mandatory: true
- id: G17-CC-05
  rule: Destructive bulk delete requires verified recoverable backup and G11 evidence
    before mutation.
  mandatory: true
- id: G17-CC-06
  rule: Material migrations reconcile and have rollback before cutover.
  mandatory: true
- id: G17-CC-07
  rule: Test DB assets use governed test namespace and are cleaned with read-back
    verification.
  mandatory: true
- id: G17-CC-08
  rule: Unknown provider quotas/formulas are not fabricated and no silent paid upgrade
    occurs.
  mandatory: true
- id: G17-CC-09
  rule: Database is not forced when file/GitHub/external-system authority is semantically
    correct.
  mandatory: true
- id: G17-CC-10
  rule: Release cannot close while Stage19 remote backup proof, Stage29 namespace
    migration, G12 or G13 gates remain open.
  mandatory: true
dependencies:
  build_time_required:
