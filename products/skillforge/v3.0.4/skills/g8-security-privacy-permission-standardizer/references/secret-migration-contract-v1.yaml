contract_id: INC_G8_SECRET_MIGRATION_V1
schema_version: '1.0'
status: CANDIDATE_STAGE30_PENDING_G12_G13
owner_skill: G8
backlog_ref: SF-G8-003
depends_on: [INC_G8_SECRET_PROVIDER_V1, INC_G17_MIGRATION_ROLLBACK_V1, INC_G17_KEY_LIFECYCLE_V1]
purpose: Govern post-deploy migration of real machine-secret authority through stable logical secret_ref bindings without exposing raw secret material to model-facing surfaces or deleting the prior authority before verified observation and approval.
execution_timing: POST_DEPLOY_OWNER_GATED
real_secret_migration_is_predeploy_release_blocker: false
predeploy_deliverables: [VERSIONED_MIGRATION_CONTRACT, POSTDEPLOY_RUNBOOK, NON_SECRET_MIGRATION_MANIFEST_SCHEMA, FAIL_CLOSED_READINESS_VALIDATOR, ROLLBACK_AND_EVIDENCE_RULES, DETERMINISTIC_SELF_TESTS]
activation_gates: [DEPLOYMENT_OF_CERTIFIED_SKILLFORGE_CONFIRMED, SF_G8_002_IMPLEMENTATION_PASS, FINAL_G12_PASS, INDEPENDENT_G13_PASS, NAMESPACE_AND_OWNERSHIP_BLOCKERS_RESOLVED, TARGET_AZURE_ENVIRONMENT_OWNER_CONFIRMED, GOOD_RECOVERABLE_BACKUP_PRESENT, ROLLBACK_MANIFEST_PRESENT, LIVE_CONSUMER_INVENTORY_COMPLETE, EXPLICIT_OWNER_EXECUTION_APPROVAL]
migration_unit_required_fields: [migration_unit_id, secret_ref, secret_class, source_authority_ref, target_environment_ref, target_provider, consumer_refs, backup_ref, rollback_ref, observation_window, status]
forbidden_manifest_fields: [raw_secret, raw_secret_value, secret_value, password, api_key, auth_token, access_token, refresh_token, private_key, private_key_bytes, client_secret_value, certificate_private_key]
migration_classes:
  G17_ROOT_KEY:
    rule: Re-read live consumers at execution time; create and verify the governed target behind the G8 logical reference; prove rollback; switch consumers only after PASS; keep prior source recoverable/read-only through observation; destructive retirement requires separate explicit owner approval.
    additional_refs: [INC_G17_KEY_LIFECYCLE_V1]
  HATCHABLE_BOOTSTRAP:
    rule: Re-evaluate workload identity federation first, then certificate-based confidential client authentication, and retain a client secret only as the bounded BOOTSTRAP_EXTERNAL_WORKLOAD_CREDENTIAL last resort when stronger routes are unavailable or operationally unsuitable.
  OTHER_MACHINE_SECRET:
    rule: Re-inventory live declarations at execution time and migrate only owner-approved classes one at a time; blanket migration is forbidden.
execution_sequence: [FREEZE_EXACT_MIGRATION_SCOPE_AND_LIVE_CONSUMERS, CONFIRM_TARGET_ENVIRONMENT_AND_PROVIDER_REGISTRY, VERIFY_GOOD_BACKUP_AND_ROLLBACK_MANIFEST, RUN_SYNTHETIC_PROVIDER_ADAPTER_PROOF, MIGRATE_ONE_OWNER_APPROVED_SECRET_CLASS, REWIRE_CONSUMERS_THROUGH_STABLE_SECRET_REF, RECONCILE_NON_SECRET_METADATA_VERSION_HASH_OR_EQUIVALENT, RUN_LEAST_PRIVILEGE_AND_FAIL_CLOSED_NEGATIVE_TESTS, ENTER_OWNER_APPROVED_OBSERVATION_WINDOW, RETIRE_LEGACY_AUTHORITY_ONLY_AFTER_EXPLICIT_DESTRUCTIVE_APPROVAL, WRITE_METADATA_ONLY_AUDIT_RECEIPTS_AND_LEAK_SCAN]
rollback:
  preserve_prior_authority_until_observation_complete: true
  default_prior_authority_state: READ_ONLY_OR_RECOVERABLE
  on_failure: [STOP_NEW_TARGET_MUTATIONS_WHEN_SAFE, RECONCILE_POST_CUTOVER_ACTIVITY, SWITCH_LOGICAL_BINDING_BACK, VERIFY_CONSUMER_OPERATION_ON_ROLLBACK_TARGET, LEAVE_NEW_TARGET_DISABLED_OR_UNREFERENCED, WRITE_G11_METADATA_ONLY_FAILURE_RECEIPT]
  triggers: [TARGET_UNAVAILABLE, AUTHORIZATION_OR_SECURITY_REGRESSION, SECRET_REF_RESOLUTION_FAILURE, CONSUMER_BEHAVIOR_REGRESSION, NON_SECRET_METADATA_OR_FINGERPRINT_MISMATCH, UNEXPLAINED_INTEGRITY_MISMATCH, OWNER_ABORT]
legacy_retirement:
  automatic_deletion: false
  destructive_approval_required: true
  require_observation_complete: true
  require_recoverability_evidence: true
evidence:
  raw_secret_material: FORBIDDEN
  allowed: [migration_unit_id, secret_ref, source_authority_ref, target_environment_ref, provider, credential_mode, key_or_secret_version, non_secret_fingerprint, operation, success_or_failure, rollback_state, actor_ref, approval_ref, timestamp_utc]
excluded_scope: [HUMAN_WEBSITE_PASSWORDS, GOOGLE_PASSWORD_MANAGER_MIGRATION, BROWSER_LOGIN_AUTOMATION, MFA_OR_EMAIL_OTP_AUTOMATION, UNAPPROVED_AZURE_BILLING_PLAN_CHANGE, POWER_AUTOMATE_RUNTIME_DEPENDENCY]
