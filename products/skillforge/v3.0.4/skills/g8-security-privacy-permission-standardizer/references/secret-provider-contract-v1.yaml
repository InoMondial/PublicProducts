contract_id: INC_G8_SECRET_PROVIDER_V1
schema_version: '1.0'
status: CANDIDATE_STAGE30_PENDING_G12_G13
owner_skill: G8
backlog_ref: SF-G8-002
purpose: Provider-neutral governance for machine secrets and trusted secret use without exposing raw values to model-facing surfaces.
policy:
  default_machine_secret_provider: AZURE_KEY_VAULT
  default_azure_tier: STANDARD
  premium_or_hsm_default_dependency: FORBIDDEN
  unknown_or_unapproved_route: FAIL_CLOSED
  raw_secret_to_llm: FORBIDDEN
  generic_model_facing_get_secret_value: FORBIDDEN
  power_automate_role: NONE
  human_password_automation: OUT_OF_SCOPE_THIS_PHASE
  child_skill_provider_account_identifiers: FORBIDDEN
  provider_account_configuration_location: ENVIRONMENT_OR_REGISTRY_ONLY
registry:
  logical_reference_field: secret_ref
  logical_reference_is_secret: false
  required_fields: [secret_ref, provider, adapter_version, environment, consumer_skill, purpose, target_resource, allowed_operation, scope, identity_ref, rotation_owner, review_date, status, version]
  forbidden_child_fields: [raw_secret_value, azure_tenant_id, azure_subscription_id, azure_vault_name, azure_account_id]
operations:
  create: AUTHORIZED_SETUP_ADMIN_BOUNDARY_ONLY
  update: AUTHORIZED_SETUP_ADMIN_BOUNDARY_ONLY
  rotate: VERIFY_REPLACEMENT_BEFORE_REFERENCE_SWITCH_AND_PRESERVE_APPROVED_ROLLBACK_WINDOW
  revoke: REVOKE_OR_DISABLE_AND_VERIFY_DENIAL
  trusted_use: TRUSTED_BACKEND_TOOL_ONLY_ONE_APPROVED_OPERATION
  health: METADATA_ONLY_AVAILABILITY_AUTHORIZATION_STATE
failure_modes: [MISSING_SECRET_REF, UNKNOWN_SECRET_REF, DENIED_IDENTITY, EXPIRED_OR_REVOKED_CREDENTIAL, PROVIDER_OUTAGE, AMBIGUOUS_ROUTE, FAILED_ROTATION_VERIFICATION, SCOPE_MISMATCH]
failure_behavior: FAIL_CLOSED_WITHOUT_PLAINTEXT_FALLBACK
azure_key_vault_adapter:
  provider: AZURE_KEY_VAULT
  tier: STANDARD
  supported_objects: [SECRET, KEY, CERTIFICATE]
  azure_hosted_identity_preference: [MANAGED_IDENTITY]
  external_identity_preference: [OIDC_WORKLOAD_IDENTITY_FEDERATION, CERTIFICATE_CONFIDENTIAL_CLIENT, CLIENT_SECRET_LAST_RESORT_BOOTSTRAP_ONLY]
  authorization: LEAST_PRIVILEGE_RBAC_AT_VAULT_OR_OBJECT_SCOPE
  metadata_only_health: true
  rotation_revocation_rollback_evidence: true
  soft_delete_required: true
  purge_protection_required: true
  private_material_return_to_model: false
external_bootstrap_exception:
  rule_id: BOOTSTRAP_EXTERNAL_WORKLOAD_CREDENTIAL
  federation_first: true
  allowed_only_when: FEDERATION_UNAVAILABLE_AND_CREDENTIAL_REQUIRED_TO_ESTABLISH_TRUST
  native_secure_store_only: true
  certificate_before_client_secret: true
  client_secret_last_resort: true
  shared_master_credential: FORBIDDEN
  controls: [WORKLOAD_AND_ENVIRONMENT_SPECIFIC_IDENTITY, EXACT_LEAST_PRIVILEGE_TARGET_SCOPE, FEDERATION_UNAVAILABILITY_REASON_RECORDED, OWNER_EXPIRY_ROTATION_REVOCATION_REVIEW_METADATA, STABLE_NON_SECRET_REGISTRY_REFERENCE, RAW_VALUE_EXCLUDED_FROM_LLM_HANDOFF_LOGS_REPOSITORIES, NATIVE_STORE_NOT_GENERAL_SECOND_SECRET_STORE]
  hatchable_case:
    candidate_ref: INC_G17_GRAPH_CLIENT_SECRET
    mutation_in_this_contract_build: PROHIBITED
    later_gate: REEVALUATE_FEDERATION_BEFORE_MIGRATION_OR_ROTATION
cross_skill_hooks:
  G0: PROPAGATE_STABLE_CONTRACT_REF_AND_REJECT_RAW_SECRET_OR_EMBEDDED_PROVIDER_ACCOUNT_IDS
  G1: BLOCK_PUBLICATION_OR_READBACK_WHEN_RAW_CREDENTIAL_OR_PRIVATE_MATERIAL_LEAKS
  G11: LOG_METADATA_ONLY_SECRET_USE_AND_AUDIT_EVENTS
  G12: BLACK_BOX_POSITIVE_NEGATIVE_SYNTHETIC_PROVIDER_TESTS
  G13: INDEPENDENT_PROVIDER_NEUTRALITY_SECURITY_COMPLETENESS_REVIEW
  G16: FORBID_CREDENTIAL_OR_PRIVATE_MATERIAL_IN_PROMPTS_HANDOFFS_HUMAN_REPORTS
  G17: USE_PROVIDER_NEUTRAL_SECRET_REFS_FOR_DATA_AND_ENCRYPTION_CONSUMERS
portability:
  current_test_environment: TEST_EVIDENCE_ONLY
  future_corporate_target: OWNER_CONFIRMED_AT_MIGRATION_GATE
  migration_rule: CHANGE_REGISTRY_ADAPTER_ENVIRONMENT_IDENTITY_RBAC_BINDINGS_NOT_CHILD_SKILL_LOGIC
deferred_scope: [HUMAN_WEBSITE_PASSWORDS, GOOGLE_PASSWORD_MANAGER_MIGRATION, BROWSER_LOGIN_AUTOMATION, MFA_OR_EMAIL_OTP_AUTOMATION, PRODUCTION_HATCHABLE_AUTH_MUTATION, REAL_PRODUCTION_SECRET_MIGRATION_OR_DELETION, POWER_AUTOMATE_RUNTIME_DEPENDENCY]
release:
  contract_implementation_before_deploy: REQUIRED
  real_secret_migration_in_this_item: PROHIBITED
  final_g12: REQUIRED
  independent_g13: REQUIRED
